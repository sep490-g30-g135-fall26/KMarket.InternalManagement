# Local development: copy .env.example to .env, then run docker compose up -d.
services:
  postgres:
    image: postgres:17-alpine
    container_name: kmarket-postgres
    environment:
      POSTGRES_DB: kmarket_internal_management
      POSTGRES_USER: kmarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U kmarket -d kmarket_internal_management
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
